name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: agit-linux-amd64
          - goos: linux
            goarch: arm64
            output: agit-linux-arm64
          - goos: darwin
            goarch: amd64
            output: agit-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: agit-darwin-arm64
          - goos: windows
            goarch: amd64
            output: agit-windows-amd64.exe
          - goos: windows
            goarch: arm64
            output: agit-windows-arm64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/${{ matrix.output }}" ./cmd/agit

      - name: Generate checksum
        run: sha256sum "dist/${{ matrix.output }}" > "dist/${{ matrix.output }}.sha256"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign binary
        run: cosign sign-blob --yes --output-signature "dist/${{ matrix.output }}.sig" --output-certificate "dist/${{ matrix.output }}.pem" "dist/${{ matrix.output }}"

      - name: Attest build provenance
        if: github.repository_visibility == 'public'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/${{ matrix.output }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: |
            dist/${{ matrix.output }}
            dist/${{ matrix.output }}.sha256
            dist/${{ matrix.output }}.sig
            dist/${{ matrix.output }}.pem

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

      - name: Publish to public binary repo
        uses: softprops/action-gh-release@v2
        with:
          repository: Satari4545/ai-git-releases
          token: ${{ secrets.RELEASE_PAT }}
          files: dist/*
